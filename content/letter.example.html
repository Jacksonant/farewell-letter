<div class="date">二〇二六年 · 仲夏</div>
<h2>致我亲爱的老板与并肩同行的伙伴们：</h2>

<p>　　如果你正读到这里，说明你已经解开了我留下的小小谜题——谢谢你愿意陪我玩这最后一次。</p>

<p>　　这段日子里，我学到的远不止工作本身。是你们的耐心、信任与一次次并肩，让我成为了今天的自己。每一个深夜的灯光、每一次推倒重来、每一句"再试试看"，我都记得清清楚楚。</p>

<p>　　天下没有不散的筵席，但有些人、有些时光，会被好好地收藏起来。我带走的，是满满的感激；留下的，是真心的祝福——愿你们前程似锦，也愿我们，<em>山水有相逢</em>。</p>

<p>　　（这一段之后由你替换成你真正想说的话。）</p>

<div class="sign">
  <div class="closing">就此别过，</div>
  <div class="name">—— 你的名字</div>
</div>

<div class="stamp">UNTIL<br>WE MEET<br>AGAIN</div>
